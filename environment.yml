name: qbank
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy==1.26.4
  - pandas==2.3.0
  - matplotlib==3.10.3
  - seaborn
  - sqlalchemy
  - psycopg2
  - pip:
    - -r backend/requirements.txt
    - fastapi
    - uvicorn[standard]
    - streamlit
    - python-dotenv
    - psycopg2-binary
    - cryptography
    - oqs
    - bcrypt
    - pydantic[email]
    - email-validator
    - python-jose[cryptography]
